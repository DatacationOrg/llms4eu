# Candidate pool for the scraper arena.
#
# Deliberately larger than the 100 pages needed: snapshot.py validates every
# candidate and keeps the first `target_per_bucket` that produce a usable
# snapshot, dropping 403s, robots-disallowed URLs and dead links. `shape` is the
# page archetype being probed -- extractors diverge on shape far more than on
# topic, so the pool spreads across shapes on purpose rather than collecting
# 25 lookalike prose articles.

target_per_bucket: 25

buckets:
