on: workflow_dispatch
# Change to below once you want to deploy on push to prod branch
# Requires your infrastructure to be set up (obviously)
# on:
#   push:
#     branches:
#       - prod

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v6
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_URL }}
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.ACR_URL }}/llms4eu
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'prod') }}
          type=sha
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - uses: azure/webapps-deploy@v2
      with:
        app-name: 'llms4eu-webapp'
        images: ${{ secrets.ACR_URL }}/llms4eu:sha-${{ steps.vars.outputs.sha_short }}
