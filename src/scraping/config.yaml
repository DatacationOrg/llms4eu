fetch_pages:
  workers: 4
  domain_delay_seconds: 1.5
  timeout_seconds: 30.0
  retry_statuses: [429, 500, 502, 503, 504]
  browser_timeout_ms: 45000
  listing_min_items: 5
  listing_min_context_words: 2
  max_document_bytes: 20971520
  max_document_pages: 100
  # Formats trafilatura cannot read at all. HTML is deliberately absent:
  # docling lost the extractor benchmark on HTML pages (research log, session 6).
  document_extensions:
    - .pdf
    - .docx
    - .pptx
    - .xlsx
    - .md
    - .txt
    - .csv
