# Localities that mirror data/brestanica.json in neighbouring countries.
#
# Brestanica is one small heritage place seen from four kinds of source: the
# attraction's own site (castle_rajhenburg, 43 pages), the town's site
# (brestanica_webpage, 31), the national biographical lexicon's entries for
# people from the area (svn_biography, 51) and the national-language Wikipedia
# articles the town article links to (wikipedia, 51). Each cluster below names
# the same four for a place elsewhere; src/scraping/seed_urls.py discovers and
# verifies the URLs and writes data/seeds/<cluster>.json.
#
# The clusters are chosen for the geo evaluation: two Slovenian NUTS-3 regions
# (Posavska already, Podravska here), a Croatian cluster 35 km from Brestanica
# across the border, a Czech pair 8 km apart, and one cluster per further
# country, so radius, NUTS-3, NUTS-2 and country scopes all carry information.
#
# `places` are Wikidata items for the lexicon query: the town first, then its
# district or county so that a small town still yields a full set. `property`
# is the lexicon's Wikidata identifier property; its formatter URL builds the
# entry links. Single-site sources also need a `source_locations` entry in
# src/preprocess/config.yaml for the geo tier.

defaults:
  site_max_pages: 45
  wikipedia_max_links: 45
  category_max: 8
  biography_max: 50
  min_text_chars: 300   # extracted text below this is a stub; rejected at seed time

# The Brestanica source each kind of new source is measured against
# (src/scraping/seed_quality.py). Sites are `attraction` (first) and `town`
# (second) unless a site sets `kind`.
reference:
  attraction: castle_rajhenburg
  town: brestanica_webpage
  biography: svn_biography
  wikipedia: wikipedia

clusters:
  # Slovenia, Podravska (SI032): Ptuj castle museum and the town's tourism site.
  si_ptuj:
    language: sl
    sites:
      - source: ptuj_museum
        root: https://pmpo.si/
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
      - source: ptuj_tourism
        root: https://visitptuj.eu/
        max_pages: 35
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
    wikipedia:
      seeds: ["Ptuj", "Ptujski grad"]
      categories: ["Kategorija:Ptujčani"]
    biography:
      property: P1254          # Slovenska biografija ID
      places: [Q15906, Q856328] # Ptuj, Podravska

  # Croatia, Krapina-Zagorje (HR064): Veliki Tabor castle, 35 km from Brestanica.
  hr_zagorje:
    language: hr
    sites:
      - source: veliki_tabor_castle
        root: https://www.veliki-tabor.hr/
        exclude: ["/Cms_Data/", "/dev~", "/cookie-policy"]
      - source: desinic_municipality
        root: https://desinic.hr/
        max_pages: 35
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
    wikipedia:
      seeds: ["Veliki Tabor", "Desinić"]
      categories: ["Kategorija:Životopisi, Krapina"]
    biography:
      property: P8581          # Hrvatski biografski leksikon ID
      places: [Q904320, Q57056] # Desinić, Krapina-Zagorje County

  # Austria, Südoststeiermark (AT224): Riegersburg castle and municipality.
  at_riegersburg:
    language: de
    sites:
      - source: riegersburg_castle
        root: https://www.dieriegersburg.at/
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
      - source: riegersburg_municipality
        root: https://www.riegersburg.gv.at/
        max_pages: 35
    wikipedia:
      seeds: ["Riegersburg (Burg)", "Riegersburg (Steiermark)"]
      categories: ["Kategorie:Person (Riegersburg, Steiermark)"]
    biography:
      property: P6194          # Austrian Biographical Encyclopedia (ÖBL) ID
      places: [Q679422, Q854043] # Riegersburg, Südoststeiermark District

  # Italy, Trieste (ITH44): Duino and Miramare castles on the Trieste coast.
  it_trieste:
    language: it
    sites:
      - source: duino_castle
        root: https://castellodiduino.it/
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
      - source: miramare_castle
        root: https://miramare.cultura.gov.it/
        max_pages: 35
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/", "/events/"]
    wikipedia:
      seeds: ["Castello di Duino", "Duino-Aurisina", "Castello di Miramare"]
    biography:
      property: P1986          # Treccani Dizionario Biografico ID
      places: [Q16934, Q546, Q16293] # Duino-Aurisina, Trieste, Province of Trieste

  # Hungary, Vas (HU222): Jurisics castle and the town of Kőszeg.
  hu_koszeg:
    language: hu
    sites:
      - source: jurisics_castle
        root: https://jurisicsvar.hu/hu/jurisicsvar/
        include: ["^/hu/", "^/en/"]
      - source: koszeg_town
        root: https://koszeg.hu/
        max_pages: 35
        include: ["^/hu/", "^/$"]
    wikipedia:
      seeds: ["Kőszeg", "Jurisics-vár"]
      categories: ["Kategória:Kőszegiek"]
    biography:
      property: P8998          # Magyar életrajzi lexikon ID
      places: [Q613813, Q187677] # Kőszeg, Vas County

  # Czechia, Jihomoravský (CZ064): Lednice castle and village ...
  cz_lednice:
    language: cs
    sites:
      - source: lednice_castle
        root: https://www.zamek-lednice.com/cs
        include: ["^/cs", "^/en"]
      - source: lednice_municipality
        root: https://www.lednice.cz/
        max_pages: 35
        exclude: ["/aktuality/", "/fotogalerie/", "/kalendar-akci/"]
    wikipedia:
      seeds: ["Lednice (okres Břeclav)", "Zámek Lednice"]
    biography:
      property: P9160          # Biographical Dictionary of the Czech Lands ID
      places: [Q1017320, Q582488] # Lednice, Břeclav District

  # ... and Valtice, 8 km away, for a within-country near-neighbour pair.
  cz_valtice:
    language: cs
    sites:
      - source: valtice_castle
        root: https://www.zamek-valtice.cz/cs
        include: ["^/cs", "^/en"]
      - source: valtice_town
        root: https://www.valtice.eu/
        max_pages: 35
        exclude: ["/aktuality/", "/fotogalerie/", "/kalendar-akci/"]
    wikipedia:
      seeds: ["Valtice", "Zámek Valtice"]

  # Slovakia, Trenčiansky (SK022): Bojnice castle and town. No lexicon has a
  # Wikidata property, so the people come from the Wikipedia category instead.
  sk_bojnice:
    language: sk
    sites:
      - source: bojnice_castle
        root: https://bojnicecastle.sk/
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/"]
      - source: bojnice_town
        root: https://www.bojnice.sk/
        max_pages: 35
    wikipedia:
      seeds: ["Bojnice", "Bojnický zámok"]
      categories: ["Kategória:Osobnosti z Bojníc"]
      max_category: 25

  # Germany, Oberbayern (DE21): Burghausen castle and town.
  de_burghausen:
    language: de
    sites:
      - source: burghausen_castle
        root: https://www.burg-burghausen.de/
      - source: burghausen_town
        root: https://www.burghausen.de/
        max_pages: 35
        exclude: ["/wp-content/", "/feed", "/tag/", "/author/", "/category/", "/aktuelles/"]
    wikipedia:
      seeds: ["Burg zu Burghausen", "Burghausen"]
      categories: ["Kategorie:Person (Burghausen)"]
    biography:
      property: P7902          # Deutsche Biographie (GND) ID
      places: [Q262669]        # Burghausen
