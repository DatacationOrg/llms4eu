rerank_candidate_limit: 30
sparse_k1: 1.5
sparse_b: 0.75
hybrid_vector_weight: 0.7
hybrid_sparse_weight: 0.3
# Method-name suffix -> cross-encoder; each yields `<provider>_<suffix>` and
# `<provider>_hybrid_<suffix>`. dtype matters for the 4B: CrossEncoder otherwise
# loads float32, 16 GB beside a 16 GB embedder on one 48 GB card.
rerankers:
  rerank:
    model_name: Qwen/Qwen3-Reranker-0.6B
  rerank_4b:
    model_name: Qwen/Qwen3-Reranker-4B
    dtype: bfloat16
reranker_batch_size: 8
reranker_device: cuda
reranker_max_length: 2048
reranker_local_files_only: true
# Geo: `<provider>_hybrid_rerank_geo`. Score = (1 - w) * text + w * geography.
geo_weight: 0.3
geo_overfetch: 4
# exp(-km / decay) by how wide the question's place is; a country gets no geo.
geo_decay_km:
  site: 10
  town: 10
  region: 50
geo_model: gemma4:26b-a4b-it-q4_K_M
geo_structured_method: function_calling
