collection_name: page_chunks
default_chunk_version: v1
chunk_versions:
  v1: title_heading_chunk
default_provider: qwen
providers:
  - english
  - qwen
  - qwen4b
  - qwen8b
  - nemotron
  - nemotron8b
  - qwen_s512

# Every provider reads its model's full context by default. `max_seq_length` is
# a truncation ceiling, not an allocation: sentence-transformers pads each batch
# to its own longest item, so raising the ceiling costs nothing on short inputs
# and simply stops cutting the long ones. With no chunk size able to overflow it,
# chunk size becomes the only variable a chunking ablation moves.
#
# These are each model's own declared capacity, not a chosen number:
#   Qwen3-Embedding-0.6B  32768   Qwen3-Embedding-4B  40960
#   Qwen3-Embedding-8B    32768
#   Nemotron-3-Embed-1B   32768   Nemotron-3-Embed-8B 32768
#   all-MiniLM-L6-v2        256 (a real hard limit)
qwen_embedding_model: Qwen/Qwen3-Embedding-0.6B
qwen_max_seq_length: 32768
qwen_batch_size: 8
qwen_local_files_only: true

qwen4b_embedding_model: Qwen/Qwen3-Embedding-4B
qwen4b_max_seq_length: 40960
qwen4b_batch_size: 1
qwen4b_local_files_only: true

# The local stand-in for the removed Azure `embed-v-4-0`, which
# docs/architecture/decisions.md records as the strongest method ever measured
# here. 15.1 GB of weights, ~16 GB resident, which still leaves the A6000 room
# for the reranker alongside it. Batch 2 rather than qwen4b's 1 because the
# per-batch pad is to the batch's own longest item, not to the 32k ceiling.
qwen8b_embedding_model: Qwen/Qwen3-Embedding-8B
qwen8b_max_seq_length: 32768
qwen8b_batch_size: 2
qwen8b_local_files_only: true

nemotron_embedding_model: nvidia/Nemotron-3-Embed-1B-BF16
nemotron_max_seq_length: 32768
nemotron_batch_size: 8
nemotron_dtype: bfloat16
nemotron_attn_implementation: sdpa
nemotron_local_files_only: true
# refs/main in the shared cache points at a metadata-only snapshot; this is the
# revision that actually carries model.safetensors. Without it the model fails
# to load despite the weights being on disk.
nemotron_revision: a5e0f804b9e90a1ca6784ecbf6e41595774fc834

# The 8B rung of the same family, so `nemotron` against `nemotron8b` is a pure
# scale change: identical tokenizer, pooling (mean), prompts ("query: " /
# "passage: ") and 32k context, 4096 dims against 1B's, Ministral-3-8B backbone
# instead of 3B. Batch 2 like qwen8b: 15 GB of weights leaves the A6000 room for
# the reranker beside it, and the per-batch pad is to the batch's own longest
# item rather than to the 32k ceiling.
#
# Read its rows knowing the family's declared language list is 42 languages and
# Slovenian is not one of them (the 1B card lists the same set). This corpus is
# Slovenian, so a gap to Qwen3-Embedding is expected to be coverage rather than
# capacity, and scaling 1B -> 8B is not expected to close it. That is the point
# of measuring it: it separates "nemotron is smaller" from "nemotron was not
# trained on this language".
nemotron8b_embedding_model: nvidia/Nemotron-3-Embed-8B-BF16
nemotron8b_max_seq_length: 32768
nemotron8b_batch_size: 2
nemotron8b_dtype: bfloat16
nemotron8b_attn_implementation: sdpa
nemotron8b_local_files_only: true
# Pinned for the same reason as the 1B: the shared cache is multi-user and a
# later metadata-only snapshot arriving at refs/main would break loading while
# the weights sat on disk. This is the revision downloaded 2026-08-18.
nemotron8b_revision: c44c20ab3f6b430336706847a6372de4b2eb3dbd

english_embedding_model: sentence-transformers/all-MiniLM-L6-v2

# The historical 512-token baseline, kept as its own provider so the cost of the
# old cap stays measurable. Every published retrieval number before 2026-08-11
# was produced at this length, where 66% of `base` chunks were truncated and
# 22% of the corpus never reached the embedder. Compare `qwen` against this to
# separate "the cap was too low" from "the chunks were the wrong size".
qwen_s512_embedding_model: Qwen/Qwen3-Embedding-0.6B
qwen_s512_max_seq_length: 512
qwen_s512_batch_size: 8

# Fallback for a provider that declares no length of its own.
embedding_max_seq_length: 512
index_upsert_batch_size: 128
query_batch_size: 128
