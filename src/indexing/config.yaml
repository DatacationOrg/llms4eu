# Shared across every provider; a model that cannot reach it is refused, and a
# document longer than it fails indexing instead of being truncated. Keep it
# about twice the chunk target in tokens (1800 chars is ~500-600 tokens).
embedding_max_seq_length: 2048
default_provider: qwen
# One entry per embedding model; the keys are SentenceTransformerIndexer fields.
providers:
  qwen:
    model_name: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3  # pragma: allowlist secret
    batch_size: 8
  qwen4b:
    model_name: Qwen/Qwen3-Embedding-4B
    batch_size: 1
  qwen8b:
    model_name: Qwen/Qwen3-Embedding-8B
    batch_size: 2
  nemotron:
    model_name: nvidia/Nemotron-3-Embed-1B-BF16
    batch_size: 8
    dtype: bfloat16
    attn_implementation: sdpa
    revision: a5e0f804b9e90a1ca6784ecbf6e41595774fc834  # pragma: allowlist secret
  nemotron8b:
    model_name: nvidia/Nemotron-3-Embed-8B-BF16
    batch_size: 2
    dtype: bfloat16
    attn_implementation: sdpa
    revision: c44c20ab3f6b430336706847a6372de4b2eb3dbd  # pragma: allowlist secret
query_batch_size: 128
# Providers that can also embed documents on OpenRouter (`--api`):
# provider -> [model, document prefix]. Same weights as the local model.
api:
  nemotron: [nvidia/nemotron-3-embed-1b:free, "passage: "]
