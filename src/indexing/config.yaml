collection_name: page_chunks
default_chunk_version: v1
chunk_versions:
  v1: title_heading_chunk
  v2: metadata_context_chunk
default_provider: qwen
providers:
  - english
  - qwen
  - qwen4b
  - nemotron
english_embedding_model: sentence-transformers/all-MiniLM-L6-v2
qwen_embedding_model: Qwen/Qwen3-Embedding-0.6B
qwen_batch_size: 8
qwen4b_embedding_model: Qwen/Qwen3-Embedding-4B
qwen4b_batch_size: 1
qwen4b_local_files_only: true
nemotron_embedding_model: nvidia/Nemotron-3-Embed-1B-BF16
nemotron_batch_size: 8
nemotron_max_seq_length: 4096
nemotron_dtype: bfloat16
nemotron_attn_implementation: sdpa
nemotron_local_files_only: true
embedding_max_seq_length: 512
qwen_local_files_only: true
index_upsert_batch_size: 128
query_batch_size: 128
