default_methods:
  - sparse_rerank
  - qwen_hybrid_rerank
result_limit: 10
# Questions come from wiki_qa_rag.parquet: `answer_ok` rows of this split, in a
# stable random order, at most question_limit unless --limit says otherwise.
split: test
question_limit: 2000
metric_ks:
  - 1
  - 5
  - 10
mrr_k: 10
category_hit_k: 5
