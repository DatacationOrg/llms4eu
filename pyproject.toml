[project]
name = "tourism-rag-minimal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "chromadb>=1.1.1",
  "httpx>=0.28.1",
  "langchain-ollama>=1.1.0",
  "lxml>=6.1.0",
  "pydantic>=2.13.4",
  "playwright>=1.60.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "sentence-transformers>=5.4.1",
  "torch>=2.6.0",
  "tqdm>=4.67.0",
  "trafilatura>=2.0.0",
  "docling>=2.95.0",
  "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
notebook = [
    "duckdb>=1.5.6",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]
