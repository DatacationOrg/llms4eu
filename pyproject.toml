[project]
name = "lllms4eu"
version = "2026.0.0"
description = ""
authors = [{ name = "Datacation", email = "info@datacation.nl" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llms4eu"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportAny = false
reportUnusedCallResult = false

[tool.bandit]
skips = [
    "B101", # Skip test for use of assert
]

[tool.ruff.lint]
select = [
    "E",   # All general Python errors (syntax, undefined names, etc.)
    "F",   # Pyflakes checks (likely bugs, unused imports/variables)
    "I",   # Import formatting and ordering rules
    "N",   # Naming conventions (variables, functions, classes)
    "B",   # Bug-prone patterns (from Ruff/Bandit integration)
    "UP",  # Modernize Python syntax (PyUpgrade)
    "SIM", # Simplify code patterns (e.g., redundant conditions)
    "C4",  # Improve list/set/dict comprehensions
    "TRY", # Exception handling
    "BLE", # Detect blind/bare except statements
    "PT",  # Pytest best practices
] # If not using Bandit, consider adding "S" for security checks
ignore = [
    "E501", # Skip line length checks
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "pypdf>=6.9.2",
    "pytest>=9.0.2",
    "pyyaml>=6.0.3",
]
