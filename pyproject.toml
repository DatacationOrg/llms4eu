[project]
name = "tourism-rag-minimal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.3",
  "httpx>=0.28.1",
  "langchain-ollama>=1.1.0",
  "lxml>=6.1.0",
  "pydantic>=2.13.4",
  "playwright>=1.60.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "sentence-transformers>=5.6.0",
  "torch>=2.14.1",
  "tqdm>=4.67.0",
  "trafilatura>=2.0.0",
  "docling>=2.120.3",
  "pyarrow>=25.0.1",
  "langchain-text-splitters>=1.1.3",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.bandit.assert_used]
skips = ["*test_*.py"] # pytest needs assert; still flagged in src

[tool.pyright]
typeCheckingMode = "standard"
